<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Damage & Status Calculator</title>
<style>
:root {
  --bg: #0f172a; --panel: #020617; --panel-soft: #020617cc;
  --input: #1e293b; --accent: #38bdf8; --accent-hover: #0ea5e9; --text: #e5e7eb;
}
* { box-sizing: border-box; }
body {
  margin:0; font-family:system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  display:flex; justify-content:center; align-items:flex-start;
  min-height:100vh; padding:24px; overflow-y:auto;
}
.card { width:100%; max-width:1200px; display:flex; gap:20px; }
.main, .status-panel {
  background: linear-gradient(180deg, #020617, #020617f0);
  padding:22px; border-radius:18px; box-shadow:0 25px 50px rgba(0,0,0,.6);
}
.main { flex:1; }
.status-panel { width:320px; }

h1 { text-align:center; margin:0 0 14px; }
h2 { margin:20px 0 8px; font-size:14px; text-transform:uppercase; letter-spacing:.08em; opacity:.85; }

.grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
label { font-size:13px; display:flex; flex-direction:column; }
input[type=number], select {
  width:100%; margin-top:4px; padding:8px; background:var(--input);
  border:none; border-radius:10px; color:var(--text); font-size:13px;
}
button {
  width:100%; margin-top:20px; padding:12px; border-radius:12px;
  border:none; background:var(--accent); color:#020617; font-weight:700;
  cursor:pointer; font-size:15px;
}
button:hover { background:var(--accent-hover); }

.coins { margin-top:10px; display:flex; flex-direction:column; gap:10px; }
.coin {
  display:flex; flex-direction:column; padding:10px; background:var(--input);
  border-radius:10px; font-size:12px;
}
.coin strong { margin-bottom:6px; }
.coin-controls { display:flex; gap:12px; margin-bottom:6px; }
.coin-controls label { display:flex; align-items:center; gap:4px; font-size:12px; }

.status-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }

.fragility-box { background:var(--panel-soft); padding:12px; border-radius:14px; margin-bottom:15px; }
.fragility-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
.frag { padding:8px; border-radius:10px; font-size:12px; }
.frag span { font-weight:700; display:block; margin-bottom:4px; }
.frag.slash { background: rgba(248,113,113,.15); }
.frag.blunt { background: rgba(96,165,250,.15); }
.frag.pierce { background: rgba(192,132,252,.15); }

.result { margin-top:18px; padding:14px; background:var(--panel-soft); border-radius:14px; font-size:13px; line-height:1.45; word-wrap:break-word; }
hr { border:none; border-top:1px solid #1e293b; margin:10px 0; }
.status-panel h2 { text-align:center; margin-bottom:10px; }
.status-effect { display:flex; flex-direction:column; gap:8px; margin-bottom:12px; background:var(--panel-soft); padding:12px; border-radius:12px; }
.status-effect label { font-size:13px; margin-bottom:4px; }
.status-effect input { width:60px; text-align:center; }
@media (max-width:480px) { .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>

<div class="card">

<div class="main">
<h1>Damage Calculator</h1>

<h2>Base Stats</h2>
<div class="grid">
<label>Base Power<input type="number" id="basePower" value="0"></label>
<label>Coin Power<input type="number" id="coinPower" value="0"></label>
<label>Damage Up (%)<input type="number" id="damageUp" value="0"></label>
<label>Final Coin Power<input type="number" id="finalCoinPower" value="0"></label>
<label>Final Coin Damage Boost (%)<input type="number" id="finalCoinBoost" value="0"></label>
</div>

<h2>Coins</h2>
<label>Number of Coins<input type="number" id="coins" value="0" min="0" max="10" onchange="renderCoins()"></label>
<div class="coins" id="coinContainer"></div>

<h2>Enemy State</h2>
<div class="grid">
<label>Stagger
<select id="staggerState">
<option value="1">None</option>
<option value="2">Staggered ×2</option>
<option value="2.5">Staggered+ ×2.5</option>
<option value="3">Staggered++ ×3</option>
</select></label>
<label>Resistance
<select id="resistState">
<option value="1">None</option>
<option value="1.5">Fatal ×1.5</option>
<option value="1.25">Weak ×1.25</option>
<option value="0.75">Endure ×0.75</option>
<option value="0.5">Resist ×0.5</option>
</select></label>
</div>

<h2>Fragility</h2>
<div class="fragility-box">
<label>General Fragile<input type="number" id="fragile" value="0" max="99"></label>
<div class="fragility-grid">
<div class="frag slash"><span>Slash</span><input type="number" id="slashFragile" value="0" max="99"></div>
<div class="frag blunt"><span>Blunt</span><input type="number" id="bluntFragile" value="0" max="99"></div>
<div class="frag pierce"><span>Pierce</span><input type="number" id="pierceFragile" value="0" max="99"></div>
</div>
</div>

<h2>Protection</h2>
<div class="fragility-box">
<label>General Protection<input type="number" id="protection" value="0" min="0" max="99"></label>
<div class="fragility-grid">
<div class="frag slash"><span>Slash</span><input type="number" id="slashProtection" value="0" min="0" max="99"></div>
<div class="frag blunt"><span>Blunt</span><input type="number" id="bluntProtection" value="0" min="0" max="99"></div>
<div class="frag pierce"><span>Pierce</span><input type="number" id="pierceProtection" value="0" min="0" max="99"></div>
</div>
</div>

<button onclick="calculate()">Calculate</button>
<div class="result" id="output"></div>
</div>

<div class="status-panel">
<h2>Enemy Status Effects</h2>
<div class="status-effect">
<label>Rupture</label>
<div>Potency: <input type="number" id="enemyRupturePotency" value="0" min="0" max="99"></div>
<div>Count: <input type="number" id="enemyRuptureCount" value="0" min="0" max="99"></div>
</div>
</div>
</div>

<script>
function renderCoins() {
  const container = document.getElementById('coinContainer');
  container.innerHTML='';
  const count = Number(document.getElementById('coins').value);
  for(let i=1;i<=count;i++){
    const div=document.createElement('div');
    div.className='coin';
    div.innerHTML=`
      <strong>Coin ${i}</strong>
      <div class="coin-controls">
        <label><input type="checkbox" id="coin${i}"> Head</label>
        <label><input type="checkbox" id="crit${i}"> Crit</label>
      </div>
      <div class="status-grid">
        <label>Rupture Potency<input type="number" id="rupturePotency${i}" value="0" min="0" max="99"></label>
        <label>Rupture Count<input type="number" id="ruptureCount${i}" value="0" min="0" max="99"></label>
      </div>
    `;
    container.appendChild(div);
  }
}

function clamp(value,max=99){ return Math.min(value,max); }

function calculate() {
  const basePower = +document.getElementById('basePower').value||0;
  const coinPower = +document.getElementById('coinPower').value||0;
  const coinsVal = +document.getElementById('coins').value||0;
  const damageUp = (+document.getElementById('damageUp').value||0)/100;
  const finalCoinPower = +document.getElementById('finalCoinPower').value||0;
  const finalCoinBoost = (+document.getElementById('finalCoinBoost').value||0)/100;
  const stagger = +document.getElementById('staggerState').value;
  const resist = +document.getElementById('resistState').value;

  const fragileMult = 1 + clamp(+document.getElementById('fragile').value+
    +document.getElementById('slashFragile').value+
    +document.getElementById('bluntFragile').value+
    +document.getElementById('pierceFragile').value,99)*0.1;

  const protectionTotal = clamp(+document.getElementById('protection').value+
    +document.getElementById('slashProtection').value+
    +document.getElementById('bluntProtection').value+
    +document.getElementById('pierceProtection').value,99);
  const protectionMult = 1 - (0.1*protectionTotal);

  let enemyRuptureCount = clamp(+document.getElementById('enemyRuptureCount').value||0);
  let enemyRupturePotency = clamp(+document.getElementById('enemyRupturePotency').value||0);

  let previous=0;
  let ruptureStack=enemyRuptureCount;
  let rupturePotencyTotal=enemyRupturePotency;

  let normalPreProtectionTotal = 0;
  let normalPostProtectionTotal = 0;
  let ruptureDamageTotal = 0;

  let breakdownNoProtect=[];
  let breakdownWithProtect=[];

  for(let i=1;i<=coinsVal;i++){
    const head=document.getElementById(`coin${i}`)?.checked;
    const crit=document.getElementById(`crit${i}`)?.checked;
    let dmg = i===1 ? (head? basePower+coinPower: basePower) : (head? previous+coinPower: previous);
    if(i===coinsVal) dmg+=finalCoinPower;

    const rupturePot=clamp(+document.getElementById(`rupturePotency${i}`).value||0);
    const ruptureCount=clamp(+document.getElementById(`ruptureCount${i}`).value||0);

    ruptureStack += ruptureCount;
    rupturePotencyTotal = clamp(rupturePotencyTotal + rupturePot, 99);

    let final = dmg;
    if(crit) final = Math.floor(final*1.2);
    final = Math.floor(final*(1+damageUp));
    if(i===coinsVal) final = Math.floor(final*(1+finalCoinBoost));

    const normalPreProtect = Math.floor(final*stagger*resist*fragileMult);
    const normalAfterProtect = Math.floor(normalPreProtect*protectionMult);

    normalPreProtectionTotal += normalPreProtect;
    normalPostProtectionTotal += normalAfterProtect;

    let coinRupture = ruptureStack>0 ? Math.min(rupturePotencyTotal,99) : 0;
    ruptureDamageTotal += coinRupture;

    breakdownNoProtect.push(`Coin ${i}: Normal ${normalPreProtect}, Rupture +${coinRupture}, Total ${normalPreProtect+coinRupture}`);
    breakdownWithProtect.push(`Coin ${i}: Normal ${normalAfterProtect}, Rupture +${coinRupture}, Total ${normalAfterProtect+coinRupture}`);

    previous = dmg;

    if(ruptureStack>0) ruptureStack--;
    if(ruptureStack===0) rupturePotencyTotal=0;
  }

  const enemyTotal = normalPostProtectionTotal + ruptureDamageTotal;

  document.getElementById('output').innerHTML=
    `<strong>Per-Coin Breakdown Without Protection</strong><br>${breakdownNoProtect.join('<br>')}<hr>`+
    `<strong>Per-Coin Breakdown With Protection</strong><br>${breakdownWithProtect.join('<br>')}<hr>`+
    `<strong>Total Normal Damage Before Protection</strong>: ${normalPreProtectionTotal}<br>`+
    `<strong>Total Normal Damage After Protection</strong>: ${normalPostProtectionTotal}<br>`+
    `<strong>Total Rupture Damage (flat)</strong>: ${ruptureDamageTotal}<br>`+
    `<strong>Total Damage</strong>: ${enemyTotal}<hr>`+
    `<strong>Remaining Enemy Rupture</strong>: Potency ${rupturePotencyTotal}, Count ${ruptureStack}`;

  document.getElementById('enemyRupturePotency').value = clamp(rupturePotencyTotal);
  document.getElementById('enemyRuptureCount').value = clamp(ruptureStack);
}
</script>
</body>
</html>
